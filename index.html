  <!-- The opening screen (#intro) shows once per visit. It is skipped for devices set to reduce motion, for automated
       tests, and after the first page of a visit. Adding ?intro=1 to the address always shows it. -->
  <script>
    (function () {
      var asked = /[?&]intro=1(&|$)/.test(location.search), skip = false;
      try {
        skip = !asked && (!!sessionStorage.getItem('intro') || matchMedia('(prefers-reduced-motion: reduce)').matches || navigator.webdriver);
        if (!skip) sessionStorage.setItem('intro', '1');
      } catch (e) {}
      if (skip) document.documentElement.classList.add('no-intro');
    })();
  </script>
