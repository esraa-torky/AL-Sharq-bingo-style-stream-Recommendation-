name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  content:
    name: Content check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/check-content.mjs
      - run: node tests/check-apps-script.mjs

  smoke:
    name: Smoke test (phone and iPad, all languages)
    runs-on: ubuntu-latest
    needs: content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node tests/smoke.mjs
